<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Jui Kolija 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
    font-family: 'Hind Siliguri', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
    overflow: hidden;
  }

.petal { position: fixed; top: -10%; color: #ff69b4; font-size: 25px; animation: fall 10s linear infinite; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.card {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 30px 25px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,105,180,0.4);
    border: 2px solid rgba(255,255,255,0.5);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-15px);} }

.title { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: #d6007f; text-shadow: 0 0 15px #ff69b4; }
.name-tag { background: linear-gradient(90deg, #ff1493, #ff69b4); color: #fff; padding: 12px 30px; border-radius: 50px; font-size: 1.4rem; font-weight: 700; margin: 15px 0; }

.cute-heart {
    width: 180px; height: 180px; margin: 20px auto;
    background: url('data:image/svg+xml,[STRIPPED]') no-repeat center;
    background-size: contain;
    filter: drop-shadow(0 0 30px #ff1493);
    animation: beat 0.8s infinite;
    cursor: pointer;
  }
  @keyframes beat { 0%,100%{transform: scale(1);} 50%{transform: scale(1.15);} }

.message-box {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    font-size: 16px;
    color: #d6007f;
    line-height: 2;
    border: 2px dashed #ff69b4;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Music Button */
.music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(90deg, #ff1493, #ff69b4);
    border: none;
    padding: 15px 20px;
    border-radius: 50px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,20,147,0.5);
    z-index: 10;
  }
</style>
</head>
<body>

<div id="petals"></div>

<div class="card">
  <div class="title">আমার</div>
  <div class="name-tag">জুই কলিজা 💖</div>

  <div class="cute-heart" onclick="showMessage()"></div>
  <div style="color: #d6007f; font-size: 13px; font-weight: 600;">হার্টের উপর চাপ দাও ❤️</div>

  <div class="message-box" id="messageBox">
    হার্টে ট্যাপ করো... কিছু স্পেশাল আছে ✨
  </div>
</div>

<button class="music-btn" onclick="toggleMusic()">♪ MUSIC</button>

<!-- Romantic Song -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/1/1/romantic-piano-112187.mp3" type="audio/mpeg">
</audio>

<script>
let msgIndex = 0;
const specialMessages = [
  `সবাই হয়তো কলিজা বলে মুখে ডাকে,<br>কিন্তু আমার কাছে তুমি আসলেই<br><b>আমার কলিজার টুকরো</b>।`,
  `তোমার হাসিতে<br>আমার দিন ভালো হয়ে যায়।<br>তুমি হাসলেই আমার দুনিয়া সুন্দর 🌸`,
  `এই পাগলটার জীবনে<br>একটু ভালোবাসার রং ছড়িয়ে দেবে, <br><b>জুই?</b> 💌`
];

function showMessage(){
  document.getElementById('messageBox').innerHTML = specialMessages[msgIndex];
  msgIndex = (msgIndex + 1) % specialMessages.length;
  playMusic(); // হার্টে চাপ দিলে মিউজিক অন হবে

  for(let i=0; i<15; i++){
    const heart = document.createElement('div');
    heart.innerHTML = '💖';
    heart.style.position = 'fixed'; heart.style.left = '50%'; heart.style.top = '50%';
    heart.style.fontSize = '20px'; heart.style.zIndex = '999';
    heart.style.animation = `burst 1s ease-out forwards`;
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1000);
  }
}

// Music Control
let musicPlaying = false;
function playMusic(){
  const music = document.getElementById('bgMusic');
  if(!musicPlaying){ music.play(); musicPlaying = true; }
}
function toggleMusic(){
  const music = document.getElementById('bgMusic');
  if(musicPlaying){ music.pause(); musicPlaying = false; }
  else{ music.play(); musicPlaying = true; }
}

// Rose petals
function createPetals(){
  const container = document.getElementById('petals');
  setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.innerHTML = '🌸';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = Math.random()*5 + 8 + 's';
    container.appendChild(p);
    setTimeout(()=>p.remove(),13000);
  },300)
}
createPetals();
</script>

<style>@keyframes burst { to { transform: translate(calc(-100px + 200px * Math.random()), calc(-100px + 200px * Math.random())) scale(0); opacity: 0; } }</style>
</body>
</html>
