<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jui Kolija ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Hind Siliguri', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Galaxy Background */
  #galaxy {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  .container {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* Neon Title */
  .top-text { text-align: center; margin-top: 20px; }
  .top-text h1 { 
    font-size: 3rem; 
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    text-shadow: 
      0 0 5px #ff00ff,
      0 0 10px #ff00ff,
      0 0 20px #ff00ff,
      0 0 40px #ff00ff;
    animation: flicker 1.5s infinite alternate;
  }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
    20%, 24%, 55% { text-shadow: none; }
  }
  
  .top-text .tag {
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    padding: 12px 30px;
    border-radius: 50px;
    display: inline-block;
    margin-top: 15px;
    font-weight: 700;
    font-size: 1.3rem;
    color: #000;
    box-shadow: 0 0 30px rgba(255,0,255,0.8);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform: scale(1);} 50%{transform: scale(1.1);} }

  /* Holographic Heart */
  .heart-wrapper { margin: 30px 0; perspective: 1000px; }
  .heart {
    width: 200px;
    height: 200px;
    background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
    background-size: 200% 200%;
    position: relative;
    transform: rotate(45deg);
    animation: beat 0.7s infinite, gradient 3s ease infinite;
    cursor: pointer;
    box-shadow: 0 0 80px #ff00ff;
    border-radius: 15px;
  }
  @keyframes gradient {
    0%{background-position: 0% 50%;}
    50%{background-position: 100% 50%;}
    100%{background-position: 0% 50%;}
  }
  .heart:before, .heart:after {
    content: "";
    width: 200px;
    height: 200px;
    background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
    background-size: 200% 200%;
    border-radius: 50%;
    position: absolute;
    animation: gradient 3s ease infinite;
  }
  .heart:before { top: -100px; left: 0; }
  .heart:after { left: -100px; top: 0; }

  /* Holographic Card */
  .system {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    color: #00ffff;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 450px;
    font-family: 'Courier New';
    font-size: 15px;
    border: 2px solid;
    border-image: linear-gradient(45deg, #ff00ff, #00ffff) 1;
    box-shadow: 0 0 40px rgba(0,255,255,0.3);
  }
  .system .status { 
    color: #00ff00; 
    text-align: center; 
    margin: 12px 0; 
    font-weight: bold; 
    font-size: 16px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50%{opacity: 0.5;} }

  .code-box {
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    color: #00ff00;
    padding: 20px;
    border-radius: 15px;
    margin-top: 25px;
    width: 90%;
    max-width: 550px;
    font-family: 'Courier New';
    font-size: 14px;
    border: 1px solid #00ffff;
    box-shadow: 0 0 30px rgba(0,255,255,0.2);
  }

  /* Shooting Stars */
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    animation: shoot 3s linear infinite;
  }
  @keyframes shoot {
    from { transform: translate(0,0); opacity: 1; }
    to { transform: translate(300px,300px); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="galaxy"></canvas>

<div class="container">
  <div class="top-text">
    <h1 id="mainText">I LOVE</h1>
    <div class="tag" id="tagText">JUI KOLIJA ✨</div>
  </div>

  <div class="heart-wrapper">
    <div class="heart" onclick="changeText()"></div>
  </div>

  <div class="system" id="systemBox">
    <div class="status">>> SYSTEM BOOTING...</div>
    <div style="display:flex; justify-content:space-between;"><span>LOVE MATRIX</span> <span>ACTIVATED</span></div>
    <div style="display:flex; justify-content:space-between;"><span>POWER CORE</span> <span>99.9%</span></div>
    <div style="display:flex; justify-content:space-between;"><span>TARGET</span> <span>JUI KOLIJA</span></div>
  </div>

  <div class="code-box">
    <div style="color:#569cd6;">// LOVE PROTOCOL v3.0</div>
    const jui = {<br>
    &nbsp; beauty: <span style="color:#ce9178">"infinite"</span>,<br>
    &nbsp; status: <span style="color:#ce9178">"my_queen"</span>,<br>
    &nbsp; love: <span style="color:#b5cea8">Infinity</span><br>
    }
  </div>
</div>

<script>
let clickCount = 0;
const texts = [
  {h1: "I LOVE", tag: "JUI KOLIJA ✨"},
  {h1: "YOU ARE", tag: "MY QUEEN 👑"},
  {h1: "FOREVER", tag: "MINE ONLY ❤️"}
];

function changeText(){
  clickCount++;
  const t = texts[clickCount % texts.length];
  document.getElementById('mainText').innerText = t.h1;
  document.getElementById('tagText').innerText = t.tag;
  
  if(clickCount >= 3){
    document.getElementById('systemBox').innerHTML = `
      <div class="status">>> INFINITE LOVE DETECTED</div>
      <div style="display:flex; justify-content:space-between;"><span>LOVE MATRIX</span> <span>OVERLOAD</span></div>
      <div style="display:flex; justify-content:space-between;"><span>POWER CORE</span> <span>∞</span></div>
      <div style="display:flex; justify-content:space-between;"><span>STATUS</span> <span>SOULMATE CONNECTED</span></div>
    `;
  }
}

// Galaxy Stars Animation
const canvas = document.getElementById('galaxy');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let stars = [];
for(let i=0; i<200; i++){
  stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2, s: Math.random()*0.05})
}
function animateGalaxy(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    s.y += s.s;
    if(s.y > canvas.height) s.y = 0;
  })
  requestAnimationFrame(animateGalaxy);
}
animateGalaxy();

// Shooting stars
setInterval(()=>{
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random()*100 + '%';
  star.style.top = Math.random()*50 + '%';
  document.body.appendChild(star);
  setTimeout(()=>star.remove(),3000);
},800)
</script>
</body>
</html>
