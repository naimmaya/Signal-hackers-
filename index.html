<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Jui Kolija 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
    font-family: 'Hind Siliguri', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Rose Petals */
 .petal {
    position: fixed;
    top: -10%;
    color: #ff69b4;
    font-size: 25px;
    animation: fall 10s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* Main Card */
 .card {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 30px 25px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,105,180,0.4);
    border: 2px solid rgba(255,255,255,0.5);
    z-index: 2;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-15px);} }

 .title {
    font-family: 'Dancing Script', cursive;
    font-size: 2.8rem;
    color: #d6007f;
    text-shadow: 0 0 15px #ff69b4;
    margin-bottom: 10px;
  }

 .name-tag {
    background: linear-gradient(90deg, #ff1493, #ff69b4);
    color: #fff;
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 15px 0;
    box-shadow: 0 10px 30px rgba(255,20,147,0.5);
  }

  /* Cute Heart */
 .cute-heart {
    width: 180px;
    height: 180px;
    margin: 20px auto;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff1493"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat center;
    background-size: contain;
    filter: drop-shadow(0 0 30px #ff1493);
    animation: beat 0.8s infinite;
    cursor: pointer;
  }
  @keyframes beat { 0%,100%{transform: scale(1);} 50%{transform: scale(1.15);} }

  /* Special Message Box */
 .message-box {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    font-size: 16px;
    color: #d6007f;
    line-height: 2;
    border: 2px dashed #ff69b4;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.5s;
  }

 .hint { color: #d6007f; font-size: 13px; margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>

<div id="petals"></div>

<div class="card">
  <div class="title">আমার</div>
  <div class="name-tag">জুই কলিজা 💖</div>

  <div class="cute-heart" onclick="showMessage()"></div>
  <div class="hint">হার্টের উপর চাপ দাও ❤️</div>

  <div class="message-box" id="messageBox">
    হার্টে ট্যাপ করো... কিছু স্পেশাল আছে ✨
  </div>
</div>

<script>
let msgIndex = 0;
const specialMessages = [
  `সবাই হয়তো কলিজা বলে মুখে ডাকে,<br>কিন্তু আমার কাছে তুমি আসলেই<br><b>আমার কলিজার টুকরো</b>।`,

  `তোমার হাসিতে<br>আমার দিন ভালো হয়ে যায়।<br>তুমি হাসলেই আমার দুনিয়া সুন্দর 🌸`,

  `এই পাগলটার জীবনে<br>একটু ভালোবাসার রং ছড়িয়ে দেবে, <br><b>জুই?</b> 💌`
];

function showMessage(){
  document.getElementById('messageBox').innerHTML = specialMessages[msgIndex];
  msgIndex = (msgIndex + 1) % specialMessages.length;

  // Heart burst effect
  for(let i=0; i<15; i++){
    const heart = document.createElement('div');
    heart.innerHTML = '💖';
    heart.style.position = 'fixed';
    heart.style.left = '50%';
    heart.style.top = '50%';
    heart.style.fontSize = '20px';
    heart.style.zIndex = '999';
    heart.style.animation = `burst 1s ease-out forwards`;
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1000);
  }
}

// Rose petals
function createPetals(){
  const container = document.getElementById('petals');
  setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.innerHTML = '🌸';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = Math.random()*5 + 8 + 's';
    container.appendChild(p);
    setTimeout(()=>p.remove(),13000);
  },300)
}
createPetals();
</script>

<style>
@keyframes burst {
  to { transform: translate(calc(-100px + 200px * Math.random()), calc(-100px + 200px * Math.random())) scale(0); opacity: 0; }
}
</style>
</body>
</html>
